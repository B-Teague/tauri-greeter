[package]
name = "tauri-greeter-ui"
version = "0.2.0"
authors = ["Brian Teague"]
edition = "2021"
license = "GPL-3.0-or-later"
# Not a crates.io crate; this also lets cargo-about skip it as a private crate.
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
# Not referenced by name: the async fn in the #[wasm_bindgen] extern block in
# app.rs expands to it.
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[workspace]
members = ["src-tauri"]

# Profile has to live in the workspace root; cargo ignores it in members.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
