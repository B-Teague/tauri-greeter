[package]
name = "cssdm"
version = "0.1.0"
description = "CSS-themeable Linux display manager"
authors = ["Brian Teague"]
edition = "2021"
license = "GPL-3.0-or-later"
# Not a crates.io crate; this also lets cargo-about skip it as a private crate.
publish = false

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name.
name = "cssdm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
pam-client = "0.5"
libc = "0.2"
serde_json = "1"

[features]
# Serve the frontend embedded in the binary instead of trunk's dev server.
# Without it every build loads http://localhost:1420, so `make` always passes
# it; only `cargo tauri dev` builds without it.
custom-protocol = ["tauri/custom-protocol"]
