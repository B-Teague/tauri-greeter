# Only the targets tauri-greeter is actually built for; without this the crate list
# picks up every Windows and macOS dependency in the graph.
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
ignore-build-dependencies = false
ignore-dev-dependencies = true
# The licenses a dependency may arrive under. All are GPLv3-compatible; a crate
# under anything else fails the build, which is the point -- it would also be a
# GPLv3 compatibility question.
accepted = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "BSL-1.0",
    "Unlicense",
    "MIT-0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]

# tauri-greeter itself is GPL-3.0-or-later and does not belong in a third-party list;
# both workspace crates are `publish = false`, so this drops them.
private = { ignore = true }
