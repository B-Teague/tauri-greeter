[package]
name = "tauri-greeter"
version = "0.1.0"
description = "CSS-themeable LightDM greeter"
authors = ["Brian Teague"]
edition = "2021"
license = "GPL-3.0-or-later"
# Not a crates.io crate; this also lets cargo-about skip it as a private crate.
publish = false

[lib]
# The `_lib` suffix keeps the lib name from colliding with the bin name.
name = "tauri_greeter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# LightDM does the authentication, so PAM is its problem, not ours. This is the
# vocabulary -- GError, GList, GObject, the main context -- for
# liblightdm-gobject-1, which `lightdm.rs` links against directly. It comes in
# under tauri's gtk already, so it is not a new build, and it re-exports the raw
# `ffi`/`gobject_ffi` bindings for the handful of places that still need them.
glib = "0.18"
# Backgrounds travel to the webview as data: URIs; tauri already builds this.
base64 = "0.22"

[dev-dependencies]
serde_json = "1"

[features]
# Serve the frontend embedded in the binary instead of trunk's dev server.
# Without it every build loads http://localhost:1420, so `make` always passes
# it; only `cargo tauri dev` builds without it.
custom-protocol = ["tauri/custom-protocol"]
